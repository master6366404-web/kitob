
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektron kutubxona</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
        }

        header {
            background: #164e3b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 15px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0002;
        }

        .book h2 {
            color: #164e3b;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .buttons a {
            display: inline-block;
            background: #164e3b;
            color: white;
            text-decoration: none;
            padding: 12px 18px;
            border-radius: 6px;
        }

        iframe {
            width: 100%;
            height: 650px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            iframe {
                height: 500px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Elektron kutubxona</h1>
    <p>Kitoblarni PDF shaklida o‘qing</p>
</header>

<div class="container">
    <div class="book">
        <h2>📖 Mening kitobim</h2>
        <p>Kitobni quyidagi oynada o‘qishingiz mumkin.</p>

        <div class="buttons">
            <a href="kitob.pdf" target="_blank">
                PDFni ochish
            </a>

            <a href="kitob.pdf" download>
                PDFni yuklab olish
            </a>
        </div>

        <iframe
            src="kitob.pdf"
            title="Kitob PDF ko‘rinishi">
        </iframe>
    </div>
</div>

</body>
</html>
